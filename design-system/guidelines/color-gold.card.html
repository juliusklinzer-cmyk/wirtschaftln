<!-- @dsCard group="Colors" viewport="700x150" name="Augustiner Gold" subtitle="Ceremonial accent — badges, crests, ornament" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--navy-900);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;box-shadow:var(--sh-sm)}
  .name{font-size:12px;font-weight:700;color:#0C2B5A}
  .hex{font-size:11px;color:rgba(12,43,90,.7);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gold-bright)"><span class="name">Gold hell</span><span class="hex">#E6C684</span></div>
    <div class="sw" style="background:var(--gold)"><span class="name">Gold</span><span class="hex">#D0AD66</span></div>
    <div class="sw" style="background:var(--gold-700)"><span class="name">Gold 700</span><span class="hex">#A6843E</span></div>
    <div class="sw" style="background:var(--grad-gold)"><span class="name">Verlauf</span><span class="hex">grad-gold</span></div>
  </div>
</body></html>
