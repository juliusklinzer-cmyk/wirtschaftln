<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--pergament);padding:22px;display:flex;gap:28px;align-items:center}
  .stat{text-align:center}
  .num{font-size:46px;font-weight:800;letter-spacing:-.03em;color:var(--muc-blau);font-variant-numeric:tabular-nums;line-height:1}
  .lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);margin-top:4px}
  .div{width:1px;align-self:stretch;background:var(--pergament-edge)}
</style></head>
<body>
  <div style="flex:1">
    <div style="font-family:var(--font-quote);font-style:italic;font-size:22px;color:var(--navy);line-height:1.35">„Oiwei anders.<br>Oiwei dahoam.“</div>
  </div>
  <div class="div"></div>
  <div class="stat"><div class="num">128</div><div class="lab">Hoibe</div></div>
  <div class="stat"><div class="num">42</div><div class="lab">Abende</div></div>
  <div class="stat"><div class="num">9</div><div class="lab">Wirtshäuser</div></div>
</body></html>
