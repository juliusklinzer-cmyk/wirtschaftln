services:
  app:
    build:
      context: ./app
      args:
        # Werden ins Client-Bundle eingebrannt — Werte kommen aus deploy/.env
        - NEXT_PUBLIC_GMAPS_KEY=${NEXT_PUBLIC_GMAPS_KEY}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_PAYPAL_POOL_URL=${NEXT_PUBLIC_PAYPAL_POOL_URL}
    restart: unless-stopped
    # Laufzeit-Secrets (VAPID privat, SMTP, …) — Vorlage: deploy/env.example
    env_file:
      - ./deploy/.env
    environment:
      - DATABASE_PATH=/data/wirtschaftln.db
      # Next-Standalone bindet sonst nur an den Container-Hostnamen —
      # 127.0.0.1-Healthcheck & Loopback brauchen 0.0.0.0
      - HOSTNAME=0.0.0.0
    volumes:
      - app-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
