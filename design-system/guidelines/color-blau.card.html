<!-- @dsCard group="Colors" viewport="700x150" name="Münchner Blau" subtitle="Hauptfarbe — the brand's load-bearing blue" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--weiss);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;box-shadow:var(--sh-sm)}
  .name{font-size:12px;font-weight:700;color:#fff}
  .hex{font-size:11px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--muc-blau)"><span class="name">Blau</span><span class="hex">#006AB3</span></div>
    <div class="sw" style="background:var(--muc-blau-700)"><span class="name">Blau 700</span><span class="hex">#004A89</span></div>
    <div class="sw" style="background:var(--navy)"><span class="name">Navy</span><span class="hex">#0C2B5A</span></div>
    <div class="sw" style="background:var(--navy-900)"><span class="name">Navy 900</span><span class="hex">#07193A</span></div>
  </div>
</body></html>
