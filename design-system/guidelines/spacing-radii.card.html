<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--ink-50);padding:22px;display:flex;gap:18px;align-items:center}
  .box{width:84px;height:84px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;color:var(--ink-500);font-weight:600}
</style></head>
<body>
  <div class="box" style="border-radius:var(--r-sm);box-shadow:var(--sh-xs)">xs</div>
  <div class="box" style="border-radius:var(--r-md);box-shadow:var(--sh-sm)">sm</div>
  <div class="box" style="border-radius:var(--r-lg);box-shadow:var(--sh-md)">md</div>
  <div class="box" style="border-radius:var(--r-xl);box-shadow:var(--sh-lg)">lg</div>
  <div class="box" style="border-radius:var(--r-pill);box-shadow:var(--sh-gold);background:var(--gold)">gold</div>
</body></html>
