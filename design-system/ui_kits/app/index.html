<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wirtschaftln — App</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html,body{margin:0;height:100%}
  body{
    background:
      linear-gradient(180deg, rgba(12,43,90,0.55), rgba(7,25,58,0.78)),
      url('../../assets/munich-alps-panorama.jpg') center/cover fixed;
    display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
    font-family:var(--font-ui);
  }
  /* ---- Servus reveal animations ---- */
  @keyframes wnRevealPhoto {
    0%   { opacity:0; transform:scale(0.3) rotate(-12deg); }
    100% { opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes wnRevealServus {
    0%   { opacity:0; transform:translateY(16px) scale(0.8); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes wnRevealUp {
    0%   { opacity:0; transform:translateY(14px); }
    100% { opacity:1; transform:translateY(0); }
  }
  @keyframes wnConfetti {
    0%   { opacity:0; transform:translateY(-20px) rotate(0); }
    12%  { opacity:1; }
    100% { opacity:0; transform:translateY(620px) rotate(420deg); }
  }
  .wn-reveal-photo  { animation: wnRevealPhoto 0.7s var(--ease-spring) both; }
  .wn-reveal-servus { animation: wnRevealServus 0.6s var(--ease-spring) 0.32s both; }
  .wn-reveal-name   { animation: wnRevealUp 0.5s var(--ease-out) 0.55s both; }
  .wn-confetti      { position:absolute; top:-12px; animation: wnConfetti 2.4s var(--ease-out) both; }
  @keyframes wnSheetIn { 0% { transform:translateY(40px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }
  @keyframes wnToastIn { 0% { transform:translateY(12px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }
  .wn-sheet-in { animation: wnSheetIn 0.34s var(--ease-out) both; }
  .wn-toast-in { animation: wnToastIn 0.26s var(--ease-out) both; }
  @media (prefers-reduced-motion: reduce) {
    .wn-reveal-photo, .wn-reveal-servus, .wn-reveal-name { animation-duration:0.001s; animation-delay:0s; }
    .wn-confetti { display:none; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="terminStore.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="PhoneFrame.jsx"></script>
  <script type="text/babel" src="terminSheets.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="TerminScreen.jsx"></script>
  <script type="text/babel" src="WirtshausScreen.jsx"></script>
  <script type="text/babel" src="RanglisteScreen.jsx"></script>
  <script type="text/babel" src="KasseScreen.jsx"></script>
  <script type="text/babel" src="LoginScreen.jsx"></script>
  <script type="text/babel" src="RegisterFlow.jsx"></script>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="Root.jsx"></script>
  <script type="text/babel">
    const App = window.Root;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
