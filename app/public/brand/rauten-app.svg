<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Plattform-Wappen für Login/Beitreten/Gründen: nur die bayrischen Rauten,
       in App-Icon-Form (abgerundetes Quadrat), ohne Rand und ohne Hintergrund. -->
  <defs>
    <pattern id="rauten" width="88" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <rect width="88" height="56" fill="#FFFFFF"/>
      <polygon points="44,0 88,28 44,56 0,28" fill="#0F9BD7"/>
    </pattern>
    <clipPath id="icon">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#icon)">
    <rect x="-100" y="-100" width="712" height="712" fill="url(#rauten)"/>
  </g>
</svg>
