<!-- @dsCard group="Colors" viewport="700x150" name="Pergament & Weiß" subtitle="Warm parchment surfaces + pure white" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--weiss);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;border:1px solid var(--ink-100)}
  .name{font-size:12px;font-weight:700;color:var(--ink-700)}
  .hex{font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--weiss)"><span class="name">Weiß</span><span class="hex">#FFFFFF</span></div>
    <div class="sw wn-parchment"><span class="name">Pergament</span><span class="hex">#F6F0E2</span></div>
    <div class="sw" style="background:var(--pergament-2)"><span class="name">Pergament 2</span><span class="hex">#EFE6D2</span></div>
    <div class="sw" style="background:var(--ink-50)"><span class="name">App BG</span><span class="hex">#F2F5F8</span></div>
  </div>
</body></html>
