<!-- @dsCard group="Colors" viewport="700x150" name="Neutral / Ink" subtitle="Cool slate ramp for text, dividers, surfaces" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--weiss);padding:18px}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:96px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--ink-100)}
  .name{font-size:11px;font-weight:700}
  .hex{font-size:10px;font-variant-numeric:tabular-nums;opacity:.7}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-900)"><span class="name" style="color:#fff">900</span><span class="hex" style="color:#fff">#14181F</span></div>
    <div class="sw" style="background:var(--ink-700)"><span class="name" style="color:#fff">700</span><span class="hex" style="color:#fff">#2C3A4B</span></div>
    <div class="sw" style="background:var(--ink-500)"><span class="name" style="color:#fff">500</span><span class="hex" style="color:#fff">#5A6B7E</span></div>
    <div class="sw" style="background:var(--ink-300)"><span class="name" style="color:var(--ink-900)">300</span><span class="hex" style="color:var(--ink-900)">#94A3B4</span></div>
    <div class="sw" style="background:var(--ink-100)"><span class="name" style="color:var(--ink-700)">100</span><span class="hex" style="color:var(--ink-700)">#E4E9EF</span></div>
  </div>
</body></html>
